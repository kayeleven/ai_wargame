<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"409","swap":true},{"code":"[45]..","swap":false,"error":true}],"selfRequestsOnly":true}'>
  <title>{% block title %}Living Memory{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body data-user-id="{{ shell.user_id if shell and shell.signed_in else '' }}">
  <a class="skip" href="#main">Skip to main content</a>
  <header class="app-shell">
    <a class="brand" href="/">Living Memory</a>
    {% if shell and shell.signed_in %}
    <nav aria-label="Account" class="account-nav">
      <a href="/account">{{ shell.display_name }}</a>
      <form method="post" action="/logout" data-guard-navigation>
        <input type="hidden" name="csrf_token" value="{{ shell.csrf }}">
        <button class="link-button" type="submit">Sign out</button>
      </form>
    </nav>
    {% else %}<a href="/login">Sign in</a>{% endif %}
  </header>
  {% block context %}{% endblock %}
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
