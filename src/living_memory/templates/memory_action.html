<section class="action" aria-label="{{ action.title }}">

<dl>
<dt>Description</dt><dd class="authored">{{ action.description }}</dd>
<dt>Intent of Action</dt><dd class="authored">{{ action.intention }}</dd>
<dt>Anticipated reaction</dt><dd class="authored">{{ action.anticipated_reaction }}</dd>
</dl>
</section>
